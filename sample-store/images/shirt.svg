<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebf1f5"/>
      <stop offset="100%" stop-color="#d9e3eb"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f5fa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg3)"/>
  <rect x="160" y="160" width="480" height="680" rx="20" fill="#ffffff" opacity="0.5"/>
  <g>
    <!-- Crisp White Shirt -->
    <path d="M280 340 C340 310, 460 310, 520 340 L560 840 L240 840 Z" fill="url(#shirt)"/>
    <!-- Collar -->
    <path d="M350 330 L400 420 L370 430 L310 350 Z" fill="#ffffff" stroke="#cdd9e3" stroke-width="2"/>
    <path d="M450 330 L400 420 L430 430 L490 350 Z" fill="#ffffff" stroke="#cdd9e3" stroke-width="2"/>
    <!-- Center Placket -->
    <rect x="390" y="420" width="20" height="420" fill="#f8fafc" stroke="#d5e0e9" stroke-width="1.5"/>
    <!-- Mother of pearl buttons -->
    <circle cx="400" cy="470" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="400" cy="540" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="400" cy="610" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="400" cy="680" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="400" cy="750" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Chest pocket -->
    <rect x="440" y="480" width="60" height="70" rx="3" fill="none" stroke="#d5e0e9" stroke-width="2"/>
  </g>
  <text x="400" y="920" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.25em" fill="#64748b">ATELIER · STUDIO POPLIN SHIRT</text>
</svg>
