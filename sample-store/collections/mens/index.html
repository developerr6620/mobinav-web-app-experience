<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Men's Collection | ATELIER</title>
  <meta name="theme-color" content="#4f46e5">
  <meta property="og:title" content="Men's">
  <link rel="stylesheet" href="/sample-store/style.css">
</head>
<body>
<div class="announce">Complimentary shipping on orders over $150</div>
<header class="site-header" role="banner">
  <div class="header-left">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </div>
  <a class="logo" href="/sample-store/">ATELIER</a>
  <div class="header-right">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <div class="cart-badge-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span class="cart-counter">2</span>
    </div>
  </div>
</header>
<nav class="drawer">
  <a href="/sample-store/collections/womens/">Women's</a>
  <a href="/sample-store/collections/mens/" class="active">Men's</a>
  <a href="/sample-store/collections/premium-pendant/">New arrivals</a>
  <a href="/sample-store/collections/collection/">Tailoring</a>
  <a href="/sample-store/collections/bottle/">Accessories</a>
</nav>
<section class="section">
  <div class="section-head" style="margin-bottom:12px">
    <div>
      <span style="font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#64748b">Category</span>
      <h1 style="font-size:22px;font-weight:700;margin:2px 0 0;letter-spacing:-.02em">MEN'S</h1>
    </div>
    <span style="font-size:12px;color:#64748b">16 items</span>
  </div>
  <div class="grid">
    <a class="card" href="/sample-store/products/towel-set-blue/">
      <div class="card-img-wrap"><img src="/sample-store/images/blazer.svg" alt="Blazer" loading="eager"></div>
      <div class="card-info"><h4>Structured blazer</h4><div class="price-row"><span class="price">$180.00</span></div></div>
    </a>
    <a class="card" href="/sample-store/products/towel-set-blue/">
      <div class="card-img-wrap"><img src="/sample-store/images/shirt.svg" alt="Shirt" loading="eager"></div>
      <div class="card-info"><h4>Poplin dress shirt</h4><div class="price-row"><span class="price">$89.00</span></div></div>
    </a>
    <a class="card" href="/sample-store/products/towel-set-blue/">
      <div class="card-img-wrap"><img src="/sample-store/images/denim.svg" alt="Denim" loading="eager"></div>
      <div class="card-info"><h4>Straight selvedge denim</h4><div class="price-row"><span class="price">$110.00</span></div></div>
    </a>
    <a class="card" href="/sample-store/products/towel-set-blue/">
      <div class="card-img-wrap"><img src="/sample-store/images/tailoring.svg" alt="Suit" loading="eager"></div>
      <div class="card-info"><h4>Minimalist coat</h4><div class="price-row"><span class="price">$220.00</span></div></div>
    </a>
  </div>
</section>
</body>
</html>
